
name: Sync Official Nuvio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge official Nuvio updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Watch Party branch
        uses: actions/checkout@v4
        with:
          ref: watchparty
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official Nuvio
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch upstream

      - name: Check official branch
        run: |
          git branch -r
          git show-ref --verify refs/remotes/upstream/cmp-rewrite

      - name: Merge official updates
        run: |
          git merge --no-edit upstream/cmp-rewrite

      - name: Push updated Watch Party branch
        run: |
          git push origin HEAD:watchparty
          
