
name: Sync Official Nuvio

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Prepare official updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Watch Party branch
        uses: actions/checkout@v4
        with:
          ref: watchparty
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official Nuvio
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch upstream cmp-rewrite

      - name: Create sync branch
        run: |
          git switch -c "sync/official-nuvio-${GITHUB_RUN_ID}"

      - name: Merge official updates
        run: |
          git merge -X ours --no-edit upstream/cmp-rewrite

      - name: Push sync branch
        run: |
          git push origin HEAD

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base watchparty \
            --head "sync/official-nuvio-${GITHUB_RUN_ID}" \
            --title "Sync official Nuvio updates" \
            --body "Review official Nuvio updates before merging. Existing Watch Party changes are favored in conflicting sections."
